[project]
name = "pyemd-rs"
description = "PyEMD with Rust."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering"
]
dependencies = ["numpy>1.24"]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/felixgwilliams/pyemd-rs/blob/main/CHANGELOG.md"
Documentation = "https://github.com/felixgwilliams/pyemd-rs"
Homepage = "https://github.com/felixgwilliams/pyemd-rs"
Repository = "https://github.com/felixgwilliams/pyemd-rs"

[dependency-groups]
dev = [
  "emd-signal>=1.6.4",
  "ipykernel>=6.29.5",
  "ipython>=8.18.1",
  "matplotlib>=3.9.4",
  "maturin>=1.8.3",
  "polars>=1.30.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "ruff>=0.11.4",
  "tqdm>=4.67.1",
]

[build-system]
requires = ["maturin>=1.8,<2.0", "numpy>=2,<3"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pyemd_rs._pyemd_rs"
python-source = "python"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["archive/*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM", "ERA", "ISC001", "PTH", "TRY003", "TD", "FIX", "PYI021"]

[tool.ruff.lint.per-file-ignores]
"!python/**" = [
  "ANN",
  "D",
  "PLR2004",
  "T20",
  "EM",
  "PLR0913",
  "FBT003",
  "INP001",
]
"tests/**.py" = ["S101"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["pyemd_rs"]

[tool.ruff.lint.pydocstyle]
convention = "google"
